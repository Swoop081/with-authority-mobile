<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>With Authority! &mdash; Rebuilt</title>
<style>
  :root {
    --void: #0a0a0c;
    --panel: #151318;
    --panel-raised: #1c1a20;
    --hairline: #2c2833;
    --gold: #c9a227;
    --gold-dim: #8a7128;
    --parchment: #ece5d3;
    --parchment-dim: #9b9488;
    --danger: #b23b3b;
    --success: #4f8f5b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--void);
    color: var(--parchment);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  .display { font-family: "Arial Black", Impact, "Franklin Gothic Bold", sans-serif; letter-spacing: 0.4px; }

  header {
    padding: 18px 18px 14px;
    border-bottom: 1px solid var(--hairline);
    background: linear-gradient(180deg, var(--panel-raised), var(--void));
  }
  header h1 { margin: 0; font-size: 21px; }
  header p { margin: 3px 0 0; font-size: 12.5px; color: var(--parchment-dim); }

  #status { display: none; }

  /* ---- Arena versus panel ---- */
  .arena {
    position: sticky;
    top: 0;
    z-index: 30;
    border-bottom: 1px solid var(--hairline);
    background: #000 url('images/crowd-bg.png') center/cover;
  }
  .arena::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0.2) 45%, rgba(0,0,0,0.15) 100%);
  }
  .arena-content { position: relative; z-index: 3; padding: 8px 10px; }
  .fighter-row { display: flex; justify-content: space-between; align-items: flex-end; }
  .fighter { flex: 1; min-width: 0; display: flex; align-items: flex-end; gap: 6px; }
  .fighter.b { flex-direction: row-reverse; }
  .fighter-portrait {
    width: 92px; height: 92px; object-fit: cover; border-radius: 5px 5px 0 0;
    border: 1px solid rgba(255,255,255,0.2); border-bottom: none; flex-shrink: 0;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,0.5));
  }
  .fighter-info { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; padding-bottom: 6px; }
  .fighter.b .fighter-info > * { align-self: flex-end; }
  .name-hp-row { display: flex; align-items: baseline; gap: 6px; }
  .fighter.b .name-hp-row { flex-direction: row-reverse; }
  .fighter-name-inline { font-size: 14px; text-shadow: 0 2px 6px rgba(0,0,0,0.9); }
  .fighter-hp-big { font-size: 22px; font-weight: 800; line-height: 1; color: var(--gold); text-shadow: 0 2px 6px rgba(0,0,0,0.9); font-family: "Arial Black", Impact, sans-serif; }
  .fighter-hp-big span { font-size: 10px; color: var(--parchment-dim); font-weight: 400; }

  .momentum-row { display: grid; grid-template-columns: repeat(2, auto); justify-content: start; gap: 2px; margin-top: 4px; }
  .fighter.b .momentum-row { justify-content: end; }
  .momentum-chip {
    display: flex; align-items: center; gap: 2px; padding: 1px 4px 1px 1px; border-radius: 4px;
    background: rgba(10,10,12,0.75); border: 1px solid var(--chip-color, var(--hairline));
    font-size: 9px;
  }
  .momentum-chip img { width: 11px; height: 11px; border-radius: 2px; display: block; }
  .chip-val { color: var(--parchment); font-weight: 700; }

  .body-damage-row { display: grid; grid-template-columns: repeat(2, auto); justify-content: start; gap: 2px; margin-top: 3px; }
  .fighter.b .body-damage-row { justify-content: end; }
  .body-damage-chip {
    font-size: 8px; padding: 1px 3px; border-radius: 4px; background: rgba(10,10,12,0.7);
    border: 1px solid var(--hairline); color: var(--parchment-dim);
  }
  .body-damage-chip b { color: var(--parchment); }

  #turn { text-align: center; padding: 8px 0 2px; font-size: 13px; color: var(--parchment-dim); letter-spacing: 0.3px; }
  #result { text-align: center; font-size: 19px; padding: 6px 16px; min-height: 24px; }
  .result-win { color: var(--gold); }
  .result-draw { color: var(--parchment-dim); }

  /* ---- Play pile section (real ring/crowd art, matching the original mockup) ---- */
  .play-pile {
    position: relative; margin: 14px; border-radius: 14px; overflow: hidden;
    border: 1px solid var(--hairline);
    background: #000 url('images/crowd-bg.png') center/cover;
    height: 190px;
  }
  .play-pile::after { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,0.35); }
  .play-pile-ropes { position: absolute; inset: 0; background: url('images/ring-ropes-overlay.png') center/100% 100% no-repeat; z-index: 2; }
  .play-pile-label {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 3;
    font-size: 22px; letter-spacing: 2px; color: rgba(255,255,255,0.9); text-shadow: 0 2px 10px rgba(0,0,0,0.9);
  }

  /* ---- Hand ---- */
  .hand-section { padding: 4px 16px 6px; }
  .hand-label { font-size: 12px; letter-spacing: 0.6px; color: var(--parchment-dim); margin-bottom: 8px; }
  .hand-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x proximity; }

  .flip-card { width: 150px; height: 200px; flex-shrink: 0; perspective: 900px; scroll-snap-align: start; cursor: pointer; }
  .flip-card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.4s; transform-style: preserve-3d; }
  .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
  .flip-face {
    position: absolute; inset: 0; backface-visibility: hidden;
    border-radius: 10px; overflow: hidden; background: var(--panel-raised) center/cover;
    box-shadow: 0 5px 14px rgba(0,0,0,0.4);
  }
  .flip-face.back { transform: rotateY(180deg); }

  /* Front: real template frame as base, character art inset, stat bar overlaid */
  .front-photo {
    position: absolute; left: 10%; top: 6%; width: 80%; height: 65%;
    object-fit: cover; border-radius: 3px;
  }
  .front-statbar {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 5px 8px 6px;
    background: rgba(8,8,10,0.88);
  }
  .front-name { font-size: 11.5px; font-weight: 700; color: var(--parchment); line-height: 1.2; margin-bottom: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .front-meta { display: flex; justify-content: space-between; font-size: 9px; color: var(--parchment-dim); }
  .front-method { font-size: 8.5px; color: var(--type-color, var(--gold)); text-transform: uppercase; letter-spacing: 0.3px; }

  /* Back: real per-category back template, name + full rules text */
  .back-content { position: absolute; inset: 0; padding: 16px 10px 10px 22px; display: flex; flex-direction: column; }
  .back-name { font-size: 13px; font-weight: 700; color: #2a2410; margin-bottom: 6px; line-height: 1.2; }
  .back-stat { font-size: 10.5px; color: #3a3220; margin-bottom: 3px; font-weight: 600; }
  .back-text { font-size: 9px; color: #3a3220; line-height: 1.35; overflow: hidden; flex: 1; margin-top: 4px; }
  .flip-face.back.dark-back .back-name,
  .flip-face.back.dark-back .back-stat,
  .flip-face.back.dark-back .back-text { color: #eee; text-shadow: 0 1px 3px rgba(0,0,0,0.6); }

  .card-locked { opacity: 0.4; }
  .card-actionable { cursor: pointer; }
  .card-actionable .flip-face.front { box-shadow: 0 0 0 2px var(--gold), 0 4px 14px rgba(201,162,39,0.4); }
  .card-back-generic { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; text-align: center; padding: 8px; font-size: 12px; color: rgba(255,255,255,0.4); background: repeating-linear-gradient(135deg, #1c1a20, #1c1a20 7px, #181620 7px, #181620 14px); }

  #log { margin: 10px 16px; padding: 12px 14px; border-radius: 10px; background: var(--panel); border: 1px solid var(--hairline); height: 26vh; overflow-y: auto; font-size: 12.5px; line-height: 1.55; }
  .log-line { color: var(--parchment-dim); white-space: pre-wrap; }
  .log-highlight { color: var(--gold); font-weight: 700; }

  #action-prompt {
    margin: 4px 16px 0; padding: 10px 12px; border-radius: 8px; font-size: 13px; text-align: center;
    background: var(--panel-raised); border: 1px solid var(--hairline); color: var(--parchment); display: none;
  }
  #action-prompt.reaction { border-color: var(--danger); background: rgba(178,59,59,0.15); }
  #action-prompt.your-turn { border-color: var(--gold); background: rgba(201,162,39,0.12); }

  .action-buttons { display: flex; gap: 9px; padding: 8px 16px 4px; }
  .action-buttons button { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid var(--hairline); background: var(--panel-raised); color: var(--parchment); font-size: 13.5px; cursor: pointer; }
  .action-buttons button.pin-btn { background: var(--danger); border-color: var(--danger); color: #fff; font-weight: 700; }
  .action-buttons button:disabled { opacity: 0.35; cursor: default; }

  .controls { display: flex; gap: 9px; padding: 10px 16px 22px; }
  button { flex: 1; padding: 13px; border-radius: 10px; border: 1px solid var(--hairline); background: var(--panel-raised); color: var(--parchment); font-size: 14.5px; cursor: pointer; }
  button:disabled { opacity: 0.4; cursor: default; }
</style>
</head>
<body>
  <div id="status" style="display:none;">Loading&hellip;</div>

  <div class="arena">
    <div class="arena-content">
      <div class="fighter-row">
        <div class="fighter a">
          <img class="fighter-portrait" id="a-portrait" alt="" />
          <div class="fighter-info">
            <div class="name-hp-row">
              <span class="fighter-name-inline display" id="a-name">&nbsp;</span>
              <span class="fighter-hp-big" id="a-hp">&mdash;<span> HP</span></span>
            </div>
            <div class="momentum-row" id="a-momentum"></div>
            <div class="body-damage-row" id="a-body"></div>
          </div>
        </div>
        <div class="fighter b">
          <img class="fighter-portrait" id="b-portrait" alt="" />
          <div class="fighter-info">
            <div class="name-hp-row">
              <span class="fighter-name-inline display" id="b-name">&nbsp;</span>
              <span class="fighter-hp-big" id="b-hp">&mdash;<span> HP</span></span>
            </div>
            <div class="momentum-row" id="b-momentum"></div>
            <div class="body-damage-row" id="b-body"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="turn">Turn 0 / 50</div>
  <div id="result"></div>
  <div id="action-prompt"></div>

  <div class="play-pile">
    <div class="play-pile-ropes"></div>
    <div class="play-pile-label display">PLAY PILE</div>
  </div>

  <div class="hand-section">
    <div class="hand-label display">YOUR HAND</div>
    <div class="hand-row" id="a-hand"></div>
  </div>

  <div class="action-buttons" id="action-buttons">
    <button id="pin-btn" class="pin-btn">Attempt Pin</button>
    <button id="pass-btn">Pass</button>
  </div>

  <div id="log"></div>

  <div class="controls">
    <button id="new-btn">New Match</button>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
